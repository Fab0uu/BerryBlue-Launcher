appId: 'Eidolyth'
productName: 'Eidolyth Launcher'
artifactName: 'Eidolyth-Launcher-${version}-${os}-${arch}.${ext}'

copyright: 'Copyright © 2024 Fabrice Lozach'

asar: true
compression: 'maximum'
afterSign: 'scripts/after-sign.js'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,.eslintrc.json}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'
  artifactName: 'Eidolyth-Launcher-setup.${ext}'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Eidolyth-Launcher-setup-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux:
  artifactName: 'Eidolyth-Launcher-setup.${ext}'
  target:
    - target: 'AppImage'
      arch:
        - 'x64'
    - target: 'deb'
      arch:
        - 'x64'
    - target: 'rpm'
      arch:
        - 'x64'
  maintainer: 'Fabrice Lozach'
  vendor: 'Fabrice Lozach'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'
  executableName: 'eidolyth-launcher'
  desktop:
    Name: 'Eidolyth Launcher'


directories:
  buildResources: 'build'
  output: 'dist'
